[project]
name = "power-design-toolkit"
version = "9.1.0"
description = "Integrated power-electronics design toolkit with LLC/PFC engineering, digital control tools and closed-loop stability analysis"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "click>=8.1",
    "rich>=13.0",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "mypy", "ruff"]
gui = ["PySide6>=6.7", "pyqtgraph>=0.13.7"]
web = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.scripts]
pfc-design = "pfc_design.__main__:cli"
pfc-control-lab = "pfc_design.control_cli:cli"
vienna-control-lab = "pfc_design.vienna_cli:cli"
power-control-codegen = "power_codegen.cli:cli"
power-design-gui = "llc_design.gui.app:run_gui"
power-design-web = "webapp.app:run"
llc-design = "llc_design.__main__:cli"
power-control-tools = "power_control_tools.__main__:cli"
llc-gui = "llc_design.gui.app:run_gui"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pfc_design*", "llc_design*", "power_codegen*", "power_control_tools*", "power_sim*", "webapp*", "backend*"]
exclude = ["*.output*", "*.__pycache__*"]

[tool.setuptools.package-data]
"pfc_design.data" = ["*.json"]
"llc_design.data" = ["*.json"]
"webapp" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["pfc_design/tests", "llc_design/tests", "power_codegen/tests", "power_control_tools/tests", "power_sim/tests", "webapp/tests", "backend/tests"]
addopts = "-q"
