[project]
name = "power-design-toolkit"
version = "7.5.0"
description = "Integrated LLC, single-phase TTPL PFC and three-phase Vienna PFC engineering design laboratory"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "click>=8.1",
    "rich>=13.0",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "mypy", "ruff"]
gui = ["PySide6>=6.7", "pyqtgraph>=0.13.7"]

[project.scripts]
pfc-design = "pfc_design.__main__:cli"
pfc-control-lab = "pfc_design.control_cli:cli"
vienna-control-lab = "pfc_design.vienna_cli:cli"
power-control-codegen = "power_codegen.cli:cli"
power-design-gui = "llc_design.gui.app:run_gui"
llc-design = "llc_design.__main__:cli"
llc-gui = "llc_design.gui.app:run_gui"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pfc_design*", "llc_design*", "power_codegen*"]
exclude = ["*.output*", "*.__pycache__*"]

[tool.setuptools.package-data]
"pfc_design.data" = ["*.json"]
"llc_design.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["pfc_design/tests", "llc_design/tests", "power_codegen/tests"]
addopts = "-q"
