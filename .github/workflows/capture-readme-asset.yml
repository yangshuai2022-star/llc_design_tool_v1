name: finalize-readme-asset

on:
  push:
    branches:
      - codex/power-design-toolkit-v10-foundation

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/power-design-toolkit-v10-foundation
          fetch-depth: 0

      - name: Embed real screenshot and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = """<!-- A real launcher screenshot is generated by scripts/capture_readme_screenshot.py and CI.\n     Do not replace it with a mock/AI-generated UI image. -->"""
          new = "![Power Design Toolkit workspace launcher](docs/assets/power-design-toolkit-overview.png)"
          if old not in text:
              raise SystemExit("README screenshot placeholder was not found; refusing an ambiguous edit")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git rm .github/workflows/capture-readme-asset.yml
          git add README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: embed real launcher screenshot"
          git push origin HEAD:codex/power-design-toolkit-v10-foundation
