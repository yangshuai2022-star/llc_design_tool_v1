name: capture-readme-asset

on:
  push:
    branches:
      - codex/power-design-toolkit-v10-foundation

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen
  MPLBACKEND: Agg

jobs:
  capture:
    if: "${{ !contains(github.event.head_commit.message, 'docs: capture real launcher screenshot') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/power-design-toolkit-v10-foundation
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]"

      - name: Capture real launcher screenshot
        run: python scripts/capture_readme_screenshot.py docs/assets/power-design-toolkit-overview.png --language en

      - name: Commit generated PNG to this branch
        shell: bash
        run: |
          git add docs/assets/power-design-toolkit-overview.png
          if git diff --cached --quiet; then
            echo "Screenshot already matches the generated UI."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: capture real launcher screenshot"
          git push origin HEAD:codex/power-design-toolkit-v10-foundation
