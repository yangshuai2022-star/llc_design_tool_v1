name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: power-design-tool-macos-arm64
            zip-name: PowerDesignTool-macOS-arm64.zip
            app-dir: dist/PowerDesignTool.app
            app-type: app
          - os: windows-latest
            artifact: power-design-tool-windows-x64
            zip-name: PowerDesignTool-Windows-x64.zip
            app-dir: dist/PowerDesignTool
            app-type: exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e ".[gui,dev,web]" httpx

      - name: Run tests
        run: python -m pytest

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name PowerDesignTool \
            --collect-data llc_design --collect-data pfc_design --collect-data power_codegen \
            --collect-data power_control_tools \
            --collect-submodules llc_design --collect-submodules pfc_design --collect-submodules power_codegen \
            --collect-submodules power_control_tools \
            packaging/launcher.py
        shell: bash

      - name: Smoke test (import check on packaged app)
        run: ls -la "${{ matrix.app-dir }}"
        shell: bash

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc dist/PowerDesignTool.app "${{ matrix.zip-name }}"

      - name: Zip Windows build
        if: runner.os == 'Windows'
        run: powershell Compress-Archive -Path dist/PowerDesignTool -DestinationPath "${{ matrix.zip-name }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.zip-name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip-name }}
          generate_release_notes: true
          body: |
            Power Design Toolkit V8.3.0 双平台安装包（自动构建）

            ## V8.3 主要功能（在 V8.2 多保真核心之上增量）
            - LLC 参数双模式：Auto Design / User Defined（通真保留 Lr/Cr/Lm/Np/Ns）
            - 固定 90° 双相 Interleaved LLC 电气/均流模型
            - power_control_tools：S2Z 离散化（Tustin / 预畸变 / 后向欧拉）、IIR/FIR 滤波器（Butterworth/Bessel/Chebyshev/Elliptic/Notch/FIR/MA/DC-Blocker）、Bode / 群延迟 / 阶跃 / 脉冲 / 零极点分析、C99 float32_t 单文件 DF2T/SOS 导出
            - 控制器扩展：PI（Kp·(1+1/(Ti·s))）、PIF、PID、PIDF、模拟 Type-II / Type-III（Pole-Zero 与 R/C 参数化）
            - Controller 与 Filter 设计器分页；实时 H(s)/H(z)
            - 3 相 120° LLC MVP（专用 Y 联结 / 共享六脉整流 FHA；3P TD/HB 参考求解器带收敛告警；非线性 3P 高保真求解器仍为 WIP，非最终 signoff 模型）
            - 修复 Control Tools GUI 构造时序竞态（filter_impl AttributeError）

            ## Windows 11
            1. 解压 `PowerDesignTool-Windows-x64.zip`
            2. 双击 `PowerDesignTool.exe` 即可运行；或源码目录双击 `OPEN_GUI_WIN.bat`

            ## macOS (Apple Silicon)
            1. 解压 `PowerDesignTool-macOS-arm64.zip`
            2. 若提示 "Apple 无法验证" / "已损坏":
               - 终端执行 `xattr -cr /Applications/PowerDesignTool.app`
               - 或右键点击 `PowerDesignTool.app` 选 "打开" → 再点 "打开"
            3. 双击 `PowerDesignTool.app` 启动；或源码目录双击 `OPEN_GUI_MACOS.command`

            ## 源码
            - 发布页同时附带源码 ZIP：`PowerDesignTool-src-<tag>.zip`（含 wheel）

  source-zip:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir artifacts .

      - name: Package source ZIP
        env:
          SRC_PKG: PowerDesignTool-src-${{ github.ref_name }}
        run: |
          set -eu
          git archive --format=zip --prefix="$SRC_PKG/" -o "$SRC_PKG.zip" HEAD
          WHEEL=$(ls artifacts/*.whl | head -1)
          python - "$SRC_PKG.zip" "$SRC_PKG" "$WHEEL" <<'PY'
          import sys, zipfile
          out, pkg, wheel = sys.argv[1:4]
          with zipfile.ZipFile(out, "a") as z:
              z.write(wheel, pkg + "/artifacts/" + wheel.split("/")[-1])
          print("appended", wheel)
          PY

      - name: Upload source ZIP to Release
        uses: softprops/action-gh-release@v2
        with:
          files: PowerDesignTool-src-${{ github.ref_name }}.zip
