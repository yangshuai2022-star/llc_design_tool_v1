name: build-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  MPLBACKEND: Agg

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install --upgrade pip
          # Include GUI + Agent dependencies so launcher/FRA and MCP smoke tests
          # execute for real instead of being silently skipped or left unimported.
          python -m pip install -e ".[dev,web,gui,agent]"

      - name: Run tests
        run: python -m pytest

      - name: Capture real launcher screenshot
        run: python scripts/capture_readme_screenshot.py docs/assets/power-design-toolkit-overview.png --language en

      - name: Upload README screenshot candidate
        uses: actions/upload-artifact@v4
        with:
          name: readme-gui-screenshot
          path: docs/assets/power-design-toolkit-overview.png
          if-no-files-found: error

  build:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: power-design-tool-macos-arm64
            zip-name: PowerDesignTool-macOS-arm64.zip
            app-dir: dist/PowerDesignTool.app
            app-type: app
          - os: windows-latest
            artifact: power-design-tool-windows-x64
            zip-name: PowerDesignTool-Windows-x64.zip
            app-dir: dist/PowerDesignTool
            app-type: exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag/version mismatch: tag={tag!r}, expected={expected!r}")
          print(f"release version contract OK: {tag}")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e ".[gui,dev,web,agent]"

      - name: Run tests
        run: python -m pytest

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name PowerDesignTool \
            --collect-data llc_design --collect-data pfc_design --collect-data power_codegen \
            --collect-submodules llc_design --collect-submodules pfc_design --collect-submodules power_codegen \
            --collect-submodules power_control_tools \
            packaging/launcher.py
        shell: bash

      - name: Packaged application self-test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -x "dist/PowerDesignTool.app/Contents/MacOS/PowerDesignTool"
          QT_QPA_PLATFORM=offscreen "dist/PowerDesignTool.app/Contents/MacOS/PowerDesignTool" --self-test

      - name: Packaged application self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = "dist/PowerDesignTool/PowerDesignTool.exe"
          if (-not (Test-Path $exe)) { throw "packaged executable not found: $exe" }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc dist/PowerDesignTool.app "${{ matrix.zip-name }}"

      - name: Zip Windows build
        if: runner.os == 'Windows'
        run: powershell Compress-Archive -Path dist/PowerDesignTool -DestinationPath "${{ matrix.zip-name }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.zip-name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip-name }}
          generate_release_notes: true
          body: |
            # Power Design Toolkit ${{ github.ref_name }}

            Automated Windows x64 and macOS Apple Silicon release artifacts.

            ## Release gates
            - full Python regression suite passed;
            - package version matches the Git tag;
            - the packaged executable itself passed `--self-test`;
            - all four GUI workspaces were constructed in offscreen mode;
            - bundled engineering-data provenance passed structural validation.

            Passing these gates demonstrates software reproducibility and package integrity only. It does **not** by itself establish hardware-release readiness; see `docs/ENGINEERING_VALIDATION.md`.

            ## Install
            **Windows 11**
            1. Extract `PowerDesignTool-Windows-x64.zip`.
            2. Run `PowerDesignTool.exe`.

            **macOS (Apple Silicon)**
            1. Extract `PowerDesignTool-macOS-arm64.zip`.
            2. If macOS blocks the unsigned app, use Finder **Open**, or clear quarantine for the app you downloaded.
            3. Run `PowerDesignTool.app`.

            The generated GitHub release notes below are the authoritative per-version change list.
