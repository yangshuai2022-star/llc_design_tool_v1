name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: power-design-tool-macos-arm64
            zip-name: PowerDesignTool-macOS-arm64.zip
            app-dir: dist/PowerDesignTool.app
            app-type: app
          - os: windows-latest
            artifact: power-design-tool-windows-x64
            zip-name: PowerDesignTool-Windows-x64.zip
            app-dir: dist/PowerDesignTool
            app-type: exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e ".[gui,dev]"

      - name: Run tests
        run: python -m pytest

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name PowerDesignTool \
            --collect-data llc_design --collect-data pfc_design --collect-data power_codegen \
            --collect-submodules llc_design --collect-submodules pfc_design --collect-submodules power_codegen \
            packaging/launcher.py
        shell: bash

      - name: Smoke test (import check on packaged app)
        run: ls -la "${{ matrix.app-dir }}"
        shell: bash

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc dist/PowerDesignTool.app "${{ matrix.zip-name }}"

      - name: Zip Windows build
        if: runner.os == 'Windows'
        run: powershell Compress-Archive -Path dist/PowerDesignTool -DestinationPath "${{ matrix.zip-name }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.zip-name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip-name }}
          generate_release_notes: true
          body: |
            Power Design Toolkit V8.2 双平台安装包（自动构建）

            ## V8.2 主要功能（在 V8.1 多保真核心之上增量）
            - DCM ON+/OPEN/ON− 互补整流求解器：轻载断续边界自适应、互补性收敛诊断
            - Golden-waveform 数字 SR：导通时序、Qrr/第三象限损耗、SR LUT 与 C99 导出
            - Golden-waveform 磁性分析：铁芯/铜损/寄生参数/热点温升
            - 固定 90° 双相与固定 120° 三相 Interleaved LLC 引擎及 GUI 页面
            - GUI 新增 SR 设计页与 Interleaved 页；CLI 新增 `v8-sr` / `v8-dcm` / `v8-magnetics` / `interleaved`
            - 启动脚本重命名与修复：`OPEN_GUI_WIN.bat` / `OPEN_GUI_MACOS.command` / `run_gui.sh`（venv 优先、Python≥3.10 校验、`[gui]` 依赖自装、CRLF/LF 规范）
            - 保留 V8.1：统一 FHA / 非线性多谐波 HB / 分段时域接口、Golden Waveform、模型比较与导出
            - 保留 V7：LLC 谐振腔/Q-ZVS/磁件/损耗/波形/数字控制；单相 TTPL PFC 与三相 Vienna PFC；LLC/TTPL/Vienna C99 Float32 控制代码生成
            - GUI 自动适配 Windows 11 深色/浅色主题；工具栏“检查更新”与联系方式

            ## Windows 11
            1. 解压 `PowerDesignTool-Windows-x64.zip`
            2. 双击 `PowerDesignTool.exe` 即可运行；或源码目录双击 `OPEN_GUI_WIN.bat`

            ## macOS (Apple Silicon)
            1. 解压 `PowerDesignTool-macOS-arm64.zip`
            2. 若提示 "Apple 无法验证" / "已损坏":
               - 终端执行 `xattr -cr /Applications/PowerDesignTool.app`
               - 或右键点击 `PowerDesignTool.app` 选 "打开" → 再点 "打开"
            3. 双击 `PowerDesignTool.app` 启动；或源码目录双击 `OPEN_GUI_MACOS.command`

            ## 使用
            - 启动后先选择 LLC 或 PFC 工作区，工具栏可随时切换
            - LLC SR：`python -m llc_design v8-sr --load 1.0`
            - LLC DCM：`python -m llc_design v8-dcm --load 0.1 --samples 512`
            - Interleaved：`python -m llc_design interleaved --phases 2`（或 `--phases 3`）
            - 单相 PFC CLI：`pfc-control-lab --output output/ttpl`
            - Vienna CLI：`vienna-control-lab --output output/vienna`
            - C99 代码生成：`python -m power_codegen --help`
