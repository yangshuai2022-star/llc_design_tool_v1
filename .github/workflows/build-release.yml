name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: power-design-tool-macos-arm64
            zip-name: PowerDesignTool-macOS-arm64.zip
            app-dir: dist/PowerDesignTool.app
            app-type: app
          - os: windows-latest
            artifact: power-design-tool-windows-x64
            zip-name: PowerDesignTool-Windows-x64.zip
            app-dir: dist/PowerDesignTool
            app-type: exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e ".[gui]"

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name PowerDesignTool \
            --collect-data llc_design --collect-data pfc_design \
            --collect-submodules llc_design --collect-submodules pfc_design \
            packaging/launcher.py
        shell: bash

      - name: Smoke test (import check on packaged app)
        run: ls -la "${{ matrix.app-dir }}"

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc dist/PowerDesignTool.app "${{ matrix.zip-name }}"

      - name: Zip Windows build
        if: runner.os == 'Windows'
        run: powershell Compress-Archive -Path dist/PowerDesignTool -DestinationPath "${{ matrix.zip-name }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.zip-name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip-name }}
          generate_release_notes: true
